version: 2

models:
  - name: crew
    description: >
      Target table for crew
    data_tests:
      - custom_test_sample:
          arguments:
            target_table: '{{ ref("latest_launch") }}'
            intake_date: '{{(var("intakeDate")|string)[:4]}}-{{(var("intakeDate")|string)[4:6]}}-{{(var("intakeDate")|string)[6:8]}}'
            product_key: 'Comscore|Visitation'
          tags: [ 'spacex-crew' ]
          alias: 'test1'
          meta: {
            'description': 'generic test on static value of launch_id',
            'quality_dimension': 'consistency' }
    columns:
      - name: launch_id
        type: varchar
        data_tests:
          - unique:
              tags: [ 'spacex-crew' ]
              alias: 'launch_id-unique'
      - name: launch_pad
        type: varchar(200)
        description: 
      - name: launch_name
        type: varchar(200)
        description: 
      - name: flight_number
        type: BIGINT
        description: 
      - name: launch_at_utc
        type: date
        description: 
      - name: launch_at_utc
        type: date
        description: 
      - name: is_successful
        type: boolen
        description: 
      - name: raw_content
        type: object
        description: 
      - name: raw_content_length
        type: bigint
        description: 
      - name: headers
        type: varchar
        description: 
      - name: images
        type: varchar
        description: 
      - name: input_fields
        type: varchar
        description: 
      - name: links
        type: varchar
        description: 
      - name: parsed_html
        type: varchar
        description: 
      - name: date_partition
        type: date
        description: 
      - name: launch_stream
        type: varchar(20)
        data_test:
          - accepted_values:
              values: ['crew'] 
